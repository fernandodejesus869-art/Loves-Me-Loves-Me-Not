<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c3a">
  <title>Loves Me, Loves Me Not</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <h1>Loves me, loves me not</h1>
    <p class="subtitle">Um jogo de pétalas em pixel art</p>
    <div class="screen-frame">
      <canvas id="game" width="180" height="240" aria-label="Jogo da flor"></canvas>
    </div>
    <div class="controls">
      <button id="pluck" type="button">Arrancar pétala</button>
      <button id="reset" type="button" class="secondary">Recomeçar</button>
    </div>
    <p class="hint">Toque na tela ou pressione Espaço para arrancar uma pétala.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
